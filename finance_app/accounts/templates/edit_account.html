{% extends "layout.html" %}
{% block title %}
  Edit account
{% endblock title %}
{% block main %}
  <div class="container">
    <form action="{{ url_for('accounts.edit', account_id=account['account_id']) }}"
          method="post">
      <div class="mb-3">
        <label class="form-label" for="accountNameInput">Account name</label>
        <input name="account_name"
               id="accountNameInput"
               class="form-control"
               type="text"
               value="{{ account['account_name'] }}" />
      </div>
      <div class="mb-3">
        <label class="form-label" for="currencyInput">Currency</label>
        <input name="currency"
               class="form-control"
               type="text"
               value="{{ account['currency'] }}" />
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-primary">Edit</button>
      </div>
    </form>
  </div>
{% endblock main %}
