{% extends "layout.html" %}
{% block title %}
  Assets
{% endblock title %}
{% block main %}
  <div class="container">
    <div class="mb-3">
      <a href="{{ url_for('assets.add') }}">Add new asset</a>
    </div>
    {% if assets %}
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Asset symbol</th>
              <th>Position open</th>
            </tr>
          </thead>
          <tbody>
            {% for asset in assets: %}
              <tr>
                <td>
                  <a href="{{ url_for('assets.show_transactions', asset_id=asset.id) }}">
                    {{ asset.info.symbol }}
                  </a>
                </td>
                <td>
                  <input type="checkbox" disabled {% if asset.still_open %}checked{% endif %} />
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% endif %}
  </div>
{% endblock main %}
