{% extends "asset_layout.html" %}
{% block asset %}
  <table class="table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Amount received</th>
      </tr>
    </thead>
    <tbody>
      {% for div in dividends: %}
        <tr>
          <td>{{ div.date | format_date }}</td>
          <td>{{ div.value | format_currency(div.account.currency) }}</td>
        </tr>
      {% endfor %}
    </tbody>
    <tfoot>
      <tr>
        <th class="border-0 text-end">Total</th>
        <td class="border-0">
          {{ total_dividends | format_currency(dividends[0].account.currency) }}
        </td>
      </tr>
    </tfoot>
  </table>
{% endblock asset %}
