{% extends "asset_layout.html" %}
{% block asset %}
  <div class="col">
    <div class="row mb-4">
      <canvas id="myChart"></canvas>
    </div>
    <div class="row">
      <p>Last updated: {{ dates[-1] | format_date }}</p>
    </div>
    <div class="row mb-4">
      <form action="{{ url_for('assets.update_prices', asset_id=asset.id) }}"
            method="post">
        <button type="submit" class="btn btn-primary">Update prices</button>
      </form>
    </div>
    <div class="row">
      <h2>Price evolution</h2>
      <table class="table">
        <tbody>
          {% for data in yearly_change %}
            <tr>
            <td>{{ data.year }}-year</td>
              <td>{{ data.percentage | format_percent }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock asset %}
{% block javascript %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('myChart');

    const labels = {{ dates | tojson }}
    const data = {{ prices | tojson }}

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          borderWidth: 1,
          pointStyle: false,
        }]
      },
      options: {
        plugins: {
          legend: {
            display: false
          }
        }
      }
    });
  </script>
{% endblock javascript %}
