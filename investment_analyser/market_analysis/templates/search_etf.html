{% extends "layout.html" %}
{% block title %}
  ETF searcher
{% endblock title %}
{% block main %}
  <div class="container">
    <form action="{{ url_for('market_analysis.search_etf') }}" method="get">
      <div class="mb-2">
        <input type="text"
               name="ticker"
               class="form-control"
               placeholder="Type ETF ticker">
      </div>
      <div class="mb-2">
        <button class="btn btn-primary" type="submit">Look up</button>
      </div>
    </form>
    {% if rows is defined %}
      <form action="{{ url_for('assets.add') }}"
            method="get">
        <div class="mb-2">
          <input type="hidden" name="ticker" class="form-control" value="{{ symbol }}">
        </div>
        <div class="mb-4">
          <button class="btn btn-primary" type="submit">Add to watchlist</button>
        </div>
      </form>
      <table class="table">
        <thead>
          <tr>
            <th class="col-3">label</th>
            <th class="col-3">Details</th>
          </tr>
        </thead>
        <tbody>
          {% for label, value in rows.items() %}
            <tr>
              <td>{{ label }}</td>
              <td>{{ value }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endif %}
{% endblock main %}
